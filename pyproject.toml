[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldstar"
version = "0.1.0"
description = "Gold layer star schema for Microsoft Fabric: SCD Type 2 dimension, point-in-time fact keys, Direct Lake ready"
requires-python = ">=3.10"
authors = [{ name = "Lucas Wall" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "duckdb>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
